# Проверка памяти без LLM: python -m evals.retrieval_eval
# Настоящая модель эмбеддингов (e5), память во временной папке.
#
# memory     — стартовые факты: путь файла -> строки
# queries    — запрос -> подстрока факта, который должен попасть в автоконтекст (то, что Юи видит каждый ход)
# negatives  — запросы, на которые память подмешивать НЕ нужно
# dedup      — существующий факт, новый факт и ожидаемое: дубль (не записывать второй раз) или нет

memory:
  user/pets:
    - "Кота пользователя зовут Барсик, он рыжий."
    - "Барсику 5 лет, он любит спать на клавиатуре."
  user/family:
    - "Сестру пользователя зовут Лена, её день рождения 3 марта."
    - "Мама пользователя живёт в Казани."
  user/interests:
    - "Пользователь любит визуальную новеллу Z.A.T.O."
    - "Пользователь интересуется аксолотлями."
    - "Пользователь слушает синтвейв по вечерам."
  user/work:
    - "Пользователь работает программистом на Python."
    - "Пользователь работает удалённо по вторникам и четвергам."
  user/food:
    - "Пользователь не ест грибы."
    - "Любимая еда пользователя — пицца с ананасами."
  user/health:
    - "У пользователя аллергия на кошачью шерсть, но он всё равно держит кота."
  system/pc:
    - "У пользователя видеокарта RTX 3060 с 12 ГБ памяти."
    - "У пользователя три монитора 1920x1080."
  system/yui/yui_preferences:
    - "Юи не любит, когда её называют ботом."
    - "Юи нравится обсуждать философию."

queries:
  - {q: "Как зовут моего кота?", expect: "Барсик"}
  - {q: "Сколько лет Барсику?", expect: "5 лет"}
  - {q: "Когда у сестры день рождения?", expect: "3 марта"}
  - {q: "Где живёт моя мама?", expect: "Казани"}
  - {q: "В какую игру я сейчас играю?", expect: "Z.A.T.O."}
  - {q: "Какую музыку я слушаю?", expect: "синтвейв"}
  - {q: "Кем я работаю?", expect: "программистом"}
  - {q: "Можно мне приготовить суп с грибами?", expect: "грибы"}
  - {q: "Какая у меня видеокарта?", expect: "RTX 3060"}
  - {q: "Сколько у меня мониторов?", expect: "три монитора"}
  - {q: "Ты бот?", expect: "ботом"}
  - {q: "What's my cat's name?", expect: "Барсик"}
  - {q: "У меня есть аллергия на что-нибудь?", expect: "аллергия"}
  - {q: "Что мне заказать на ужин?", expect: "пицца"}

negatives:
  - "Какая сегодня погода?"
  - "Расскажи анекдот."
  - "Сколько будет два плюс два?"
  - "Кто написал «Войну и мир»?"
  - "Привет, как дела?"
  - "Посоветуй фильм на вечер."
  - "Который час?"
  - "Как настроение?"

dedup:
  - {old: "Кота пользователя зовут Барсик, он рыжий.", new: "Кот пользователя — рыжий Барсик.", dup: true}
  - {old: "Кота пользователя зовут Барсик, он рыжий.", new: "У пользователя есть второй кот, Мурзик, чёрный.", dup: false}
  - {old: "Кота пользователя зовут Барсик, он рыжий.", new: "У пользователя есть собака по кличке Рекс.", dup: false}
  - {old: "Кота пользователя зовут Барсик.", new: "Кота пользователя зовут Мурзик.", dup: false}
  - {old: "Сестру пользователя зовут Лена, её день рождения 3 марта.", new: "День рождения сестры Лены — 3 марта.", dup: true}
  - {old: "Сестру пользователя зовут Лена, её день рождения 3 марта.", new: "Брата пользователя зовут Андрей.", dup: false}
  - {old: "Пользователь не ест грибы.", new: "Пользователь не любит грибы и не ест их.", dup: true}
  - {old: "Пользователь любит визуальную новеллу Z.A.T.O.", new: "Пользователь любит визуальную новеллу Katawa Shoujo.", dup: false}
  - {old: "Пользователь работает удалённо по вторникам и четвергам.", new: "Пользователь работает из дома по вторникам и четвергам.", dup: true}
